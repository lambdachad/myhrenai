<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <title>Myhren AI | AI & Automation for Businesses</title>
        <meta
            name="description"
            content="AI systems and automations that eliminate manual busywork. We build custom workflows, AI agents, and integrations so your team can focus on what actually grows the business."
        />
        <meta
            name="keywords"
            content="AI automation agency, workflow automation, AI agents, business process automation, system integration, n8n, custom AI solutions, Norway, Myhren AI"
        />

        <meta
            property="og:title"
            content="Myhren AI | AI & Automation for Businesses"
        />
        <meta
            property="og:description"
            content="Your team is drowning in repetitive work. We fix that. Custom AI systems and automations that eliminate manual busywork."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://myhren.ai/" />
        <meta property="og:site_name" content="Myhren AI" />
        <meta property="og:image" content="https://myhren.ai/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Myhren AI | AI & Automation for Businesses"
        />
        <meta
            name="twitter:description"
            content="Your team is drowning in repetitive work. We fix that. Custom AI systems and automations that eliminate manual busywork."
        />
        <meta name="twitter:image" content="https://myhren.ai/og-image.png" />

        <link rel="canonical" href="https://myhren.ai/" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "Myhren AI",
                "url": "https://myhren.ai",
                "description": "Myhren AI builds custom AI systems and automations for businesses. Workflow automation, AI agents, system integrations, and process consulting.",
                "areaServed": "NO",
                "contactPoint": {
                    "@type": "ContactPoint",
                    "contactType": "sales",
                    "email": "contact@myhren.ai"
                }
            }
        </script>

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "FAQPage",
                "mainEntity": [
                    {
                        "@type": "Question",
                        "name": "What exactly does Myhren AI build?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "We build custom AI systems and automations for businesses. This includes workflow automation, AI agents that handle repetitive tasks 24/7, system integrations that connect your tools, and process consulting to find the bottlenecks costing you money."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "How much does it cost?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "It depends on complexity. Most projects start at a free strategy call where we scope the work and give you a fixed price. No surprises, no hidden fees."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "How long does it take?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Most automations are live within 1-2 weeks. Complex AI systems take 3-6 weeks. We give you a clear timeline before starting."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Do I need to be technical?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "No. We handle everything. You just tell us what's slowing you down, and we build the solution."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "What if it breaks?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "We offer ongoing support and monitoring. If something breaks, we fix it. That's the deal."
                        }
                    }
                ]
            }
        </script>

        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
